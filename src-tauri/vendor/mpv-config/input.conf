# Bindings de mpv para el reproductor embebido (Linux y Windows).
# Las teclas las recibe primero Kütral (mpv_embed: tecla()): flechas, Enter,
# Espacio, Esc/Backspace, c/a/v (menús), i (diagnóstico) y t (pasar a la TV)
# son nuestras. Las que no,
# llegan acá con `keypress`.
# OJO: con libmpv embebido NO hay 'quit' (mataría el handle).

RIGHT seek  10
LEFT  seek -10
UP    add volume  5
DOWN  add volume -5
SPACE cycle pause
ENTER cycle pause
m     cycle mute
j     cycle sub          # ciclar subtítulos
SHIFT+j cycle sub down
# 3 = ciclar pista de audio (doblaje)
3     cycle audio

# Sincronizar y mover subtítulos (el panel es Subtítulos → Sincronizar y
# mover…, que no pausa el video). sub-delay + = aparecen después; sub-pos
# 100 = abajo del todo, menos = más arriba. r/R como en mpv (la t es la TV).
z     add sub-delay -0.1
x     add sub-delay  0.1
r     add sub-pos -2
R     add sub-pos  2
