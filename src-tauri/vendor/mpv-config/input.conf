# Bindings para PELÍCULAS (config-dir por defecto). Flechas = seek.
# uosc añade sus propios bindings de UI; aquí solo lo esencial.
# OJO: con libmpv embebido NO hay 'quit' (mataría el handle). Esc/Backspace los
# intercepta el GLArea en Rust → stop() (oculta video, vuelve a menús).

# Esc/Backspace: en Windows (mpv proceso aparte) avisan a Kütral por IPC, que
# pausa, minimiza mpv y vuelve a los menús con la pill para retomar — lo mismo
# que en Linux. Sin esto Esc solo salía de pantalla completa. En Linux nunca
# llegan acá: los atrapa el GLArea.
ESC script-message kutral-salir
BS  script-message kutral-salir

RIGHT seek  10
LEFT  seek -10
UP    add volume  5
DOWN  add volume -5
SPACE cycle pause
ENTER cycle pause
m     cycle mute
j     cycle sub          # ciclar subtítulos
SHIFT+j cycle sub down
# 3 = ciclar pista de audio (doblaje)
3     cycle audio

# OJO: en Linux (libmpv embebido) uosc NO se carga — la UI es el bar de iconos
# de kutral (Rust), que funciona con teclado Y mouse. Las teclas c/a/v abren
# NUESTROS menús desde el handler del GLArea, no desde acá. Estos bindings de
# uosc quedan solo para el camino no-Linux (mpv proceso externo).
TAB   script-binding uosc/toggle-ui

# Menú de uosc (botón ☰ de la barra o clic derecho). Solo Windows: en Linux
# uosc no se carga y el bar propio ya trae estas acciones. Con ítems "#!"
# uosc REEMPLAZA su menú por defecto, así que van también los esenciales.
# "#" como tecla = solo en el menú. Las acciones kutral-* las recibe el
# backend por IPC (player.rs, vigía de eventos).
MBTN_RIGHT script-binding uosc/menu
#     script-binding uosc/subtitles           #! Subtítulos
s     script-message kutral-subs              #! Descargar subtítulos…
#     script-binding uosc/audio               #! Audio
f     script-message kutral-fuente            #! Cambiar fuente
#     script-binding uosc/stream-quality      #! Calidad
#     script-binding uosc/chapters            #! Capítulos
#     script-binding uosc/audio-device        #! Utilidades > Salida de audio
#     set video-aspect-override "-1"          #! Utilidades > Relación de aspecto > Original
#     set video-aspect-override "16:9"        #! Utilidades > Relación de aspecto > 16:9
#     set video-aspect-override "4:3"         #! Utilidades > Relación de aspecto > 4:3
#     set video-aspect-override "2.35:1"      #! Utilidades > Relación de aspecto > 2.35:1
q     quit                                    #! Salir
