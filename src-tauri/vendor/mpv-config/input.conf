# Bindings para PELÍCULAS (config-dir por defecto). Flechas = seek.
# uosc añade sus propios bindings de UI; aquí solo lo esencial + salir a kutral.
ESC quit
BS  quit
q   quit

RIGHT seek  10
LEFT  seek -10
UP    add volume  5
DOWN  add volume -5
SPACE cycle pause
ENTER cycle pause
m     cycle mute
j     cycle sub          # ciclar subtítulos
SHIFT+j cycle sub down
# 3 = ciclar pista de audio (doblaje)
3     cycle audio

# Menús de uosc (también accesibles con el mouse).
TAB   script-binding uosc/toggle-ui
c     script-binding uosc/subtitles      # menú de subtítulos
a     script-binding uosc/audio          # menú de pistas de audio
