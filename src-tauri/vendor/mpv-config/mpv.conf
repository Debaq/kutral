# Config de mpv para kutral. uosc reemplaza el OSC clásico por una UI moderna.
# uosc se carga solo desde scripts/uosc/. Requiere apagar el osc/osd-bar viejos.
osc=no
osd-bar=no
border=no

# Calidad / rendimiento.
hwdec=auto-safe
keep-open=no

# Subtítulos legibles por defecto (uosc respeta esto).
sub-font-size=42
sub-border-size=2.4
sub-color='#FFFFFFFF'
sub-border-color='#FF000000'

# Buffer generoso para streams de red (RD directo e IPTV/HLS).
cache=yes
demuxer-max-bytes=150MiB
demuxer-readahead-secs=20

# Segundos que junta mpv antes de REANUDAR tras quedarse sin buffer. El default
# de mpv es 1s: con red mala reanuda casi vacío y se vuelve a cortar enseguida,
# que es el "corta cada dos segundos" clásico. Estos tres valores los pisa en
# caliente el preset de Configuración (ver src/lib/cacheWatch.svelte.ts), y la
# vigilancia automática sube este de a poco si la red se porta mal. Lo de acá
# es el punto de partida y lo que rige para trailers e IPTV.
cache-pause-wait=2

# Si el link RD/CDN se corta o se estanca a mitad de stream, mpv reintenta en
# vez de quedarse esperando para siempre. Con el cache vacío y sin esto, el
# render() del GLArea bloquea el hilo main GTK indefinido -> ventana "no
# responde" para el WM (KDE la mata con kwin_killer_helper).
network-timeout=15
stream-lavf-o=reconnect=1,reconnect_streamed=1,reconnect_delay_max=5
