# Bindings para IPTV (se pasa con --input-conf, sobreescribe el de películas).
# En vivo el seek no sirve: flechas ←/→ = ZAPPING de canal (playlist).
ESC quit
BS  quit
q   quit

RIGHT playlist-next
LEFT  playlist-prev
UP    add volume  5
DOWN  add volume -5
SPACE cycle pause
ENTER cycle pause
m     cycle mute

# uosc: menú de playlist (lista de canales) y UI.
TAB   script-binding uosc/toggle-ui
p     script-binding uosc/playlist
