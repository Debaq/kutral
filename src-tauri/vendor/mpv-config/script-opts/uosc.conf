# uosc con identidad Kütral (naranja fuego sobre fondo oscuro).
# Colores en HEX RGB. foreground = barra reproducida + cursor + botones activos.

# Timeline más alta y visible (default 40).
timeline_size=52
timeline_line_width=2

# Paleta de marca: naranja #f97316, texto cream #ffe6c8, fondo #15151c.
color=foreground=f97316,foreground_text=1a1a22,background=15151c,background_text=ffe6c8,curtain=0a0a0f,success=9be38a,error=ff7373

# Mostrar siempre la duración total y posición.
time_precision=0
font_scale=1.05

# Teclado-first: al PAUSAR, mantener visibles timeline + controles + volumen
# (sin esto se esconden y no se ven los atajos). Valores: comma-list de
# paused,audio,image,idle,windowed,fullscreen.
timeline_persistency=paused
controls_persistency=paused
volume_persistency=paused
top_bar_persistency=paused
