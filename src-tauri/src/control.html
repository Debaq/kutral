<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<title>Kütral · Control</title>
<style>
  :root {
    --bg: #0b0b0f;
    --panel: #15151c;
    --panel-2: #1c1c26;
    --border: #2a2a36;
    --text: #e6e6ec;
    --muted: #a0a0aa;
    --accent: #e23b3b;
    --shadow-dark: rgba(0, 0, 0, 0.6);
  }
  /* Mismas pieles que el mando, misma clave de localStorage. */
  html[data-skin="rojo"] {
    --bg: #000000; --panel: #5e0d12; --panel-2: #7a1018;
    --border: #a8202a; --text: #ffe8ea; --muted: #d8a0a6; --accent: #ff3030;
  }
  html[data-skin="naranja"] {
    --bg: #0b0b0f; --panel: #15151c; --panel-2: #1c1c26;
    --border: #2a2a36; --text: #e6e6ec; --muted: #a0a0aa; --accent: #f3a951;
  }
  html[data-skin="azul"] {
    --bg: #070a10; --panel: #11151f; --panel-2: #161c2a;
    --border: #232c40; --text: #e6ecf4; --muted: #92a0b8; --accent: #4a8ed8;
  }
  html[data-skin="verde"] {
    --bg: #060c08; --panel: #101813; --panel-2: #16221c;
    --border: #1f3328; --text: #e6f1ea; --muted: #92ad9d; --accent: #5fb86b;
  }
  html[data-skin="morado"] {
    --bg: #0b070f; --panel: #160f1c; --panel-2: #1d1426;
    --border: #2f1e3c; --text: #ece6f4; --muted: #a698b8; --accent: #a45fd8;
  }
  html[data-skin="mono"] {
    --bg: #0a0a0a; --panel: #141414; --panel-2: #1c1c1c;
    --border: #2a2a2a; --text: #ededed; --muted: #9a9a9a; --accent: #ededed;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, sans-serif;
    overscroll-behavior: none;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
    min-height: 100vh; min-height: 100dvh;
  }
  body {
    display: flex; flex-direction: column; align-items: center;
    padding: 12px 12px max(12px, env(safe-area-inset-bottom)) 12px;
    gap: 12px;
  }
  .wrap { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 12px; }

  /* ── Barra superior ─────────────────────────────────────────── */
  .topbar {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 12px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; position: relative;
  }
  .topbar .logo { color: var(--accent); font-size: 15px; }
  .topbar .name { font-size: 13px; letter-spacing: 0.04em; }
  .topbar .sep { flex: 1; }

  /* Conmutador Control / Mando */
  .switch {
    display: inline-flex; padding: 2px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 999px;
  }
  .switch a {
    text-decoration: none; color: var(--muted);
    font-size: 11px; letter-spacing: 0.04em;
    padding: 5px 11px; border-radius: 999px;
  }
  .switch a.on { background: var(--accent); color: var(--bg); font-weight: 700; }

  .skin-wrap { position: relative; display: inline-flex; align-items: center; }
  .skin-btn {
    appearance: none; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text);
    width: 26px; height: 26px; border-radius: 50%;
    padding: 0; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: inset 0 0 0 2px var(--accent);
  }
  .skin-btn::after { content: ""; width: 11px; height: 11px; border-radius: 50%; background: var(--accent); }
  .skin-menu {
    position: absolute; top: 34px; right: 0; z-index: 50;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px; display: none; gap: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
  }
  .skin-menu.open { display: flex; }
  .skin-dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
  .skin-dot.active { border-color: #fff; }
  .skin-dot[data-skin="rojo"]    { background: #ff3030; }
  .skin-dot[data-skin="naranja"] { background: #f3a951; }
  .skin-dot[data-skin="azul"]    { background: #4a8ed8; }
  .skin-dot[data-skin="verde"]   { background: #5fb86b; }
  .skin-dot[data-skin="morado"]  { background: #a45fd8; }
  .skin-dot[data-skin="mono"]    { background: #ededed; }

  /* ── Reproduciendo ──────────────────────────────────────────── */
  .np {
    padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 12px; background: var(--panel);
  }
  .np .line { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .np .title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np .time { color: var(--muted); font-variant-numeric: tabular-nums; }
  .np .bar { height: 5px; border-radius: 3px; background: var(--border); margin-top: 8px; overflow: hidden; }
  .np .fill { height: 100%; width: 0%; background: var(--accent); transition: width .3s; }

  /* ── Cruceta ────────────────────────────────────────────────── */
  .pad {
    position: relative; width: 100%; aspect-ratio: 1 / 1; max-height: 46vh;
    margin: 0 auto;
    background: radial-gradient(circle at 50% 40%, var(--panel-2), var(--panel));
    border: 1px solid var(--border); border-radius: 50%;
    box-shadow: 0 10px 30px var(--shadow-dark), inset 0 1px 0 rgba(255,255,255,0.05);
    display: grid;
    grid-template-columns: 1fr 1.15fr 1fr;
    grid-template-rows: 1fr 1.15fr 1fr;
    padding: 10px;
  }
  .pad button {
    appearance: none; border: 0; background: transparent; color: var(--text);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; font-size: 26px; cursor: pointer; border-radius: 16px;
  }
  .pad button small { font-size: 10px; color: var(--muted); letter-spacing: 0.04em; }
  .pad button.press { background: rgba(255,255,255,0.09); }
  .pad .up    { grid-area: 1 / 2; }
  .pad .left  { grid-area: 2 / 1; }
  .pad .ok    { grid-area: 2 / 2; }
  .pad .right { grid-area: 2 / 3; }
  .pad .down  { grid-area: 3 / 2; }
  .pad .ok {
    background: var(--accent); color: var(--bg);
    border-radius: 50%; font-size: 20px; font-weight: 800; letter-spacing: 0.06em;
    box-shadow: 0 4px 14px var(--shadow-dark);
  }
  .pad .ok small { color: rgba(0,0,0,0.55); }
  .pad .ok.press { filter: brightness(0.85); background: var(--accent); }
  .pad .corner { pointer-events: none; }

  /* ── Filas de botones ───────────────────────────────────────── */
  .row { display: grid; gap: 10px; }
  .row.c3 { grid-template-columns: repeat(3, 1fr); }
  .row.c2 { grid-template-columns: repeat(2, 1fr); }
  .row.c1 { grid-template-columns: 1fr; }
  .row button, .row a.btn {
    appearance: none; text-decoration: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; min-height: 60px; padding: 8px 4px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    color: var(--text); font-size: 20px; cursor: pointer;
  }
  .row button span, .row a.btn span { font-size: 11px; color: var(--muted); letter-spacing: 0.03em; }
  .row button span.ico { font-size: 20px; color: var(--text); letter-spacing: 0; }
  .row button.press { background: var(--panel-2); transform: scale(0.97); }

  .sec-title {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--muted); margin: 2px 0 -4px 4px;
  }
  .play-only { display: none; }
  body[data-mode="play"] .play-only { display: grid; }
  body[data-mode="play"] .play-title { display: block; }
  .play-title { display: none; }

  .status {
    font-size: 12px; color: var(--muted); text-align: center;
    min-height: 16px; letter-spacing: 0.02em;
  }
  .status.err { color: #ff5252; }
</style>
</head>
<body data-mode="nav">
  <div class="wrap">
    <div class="topbar">
      <span class="logo">✦</span>
      <span class="name">Kütral</span>
      <span class="sep"></span>
      <nav class="switch">
        <a href="/" class="on">Control</a>
        <a href="/mando">Mando</a>
      </nav>
      <div class="skin-wrap">
        <button class="skin-btn" id="skinBtn" aria-label="Cambiar piel" aria-haspopup="true" aria-expanded="false"></button>
        <div class="skin-menu" id="skinMenu" role="menu">
          <button class="skin-dot" data-skin="rojo"    aria-label="Rojo"></button>
          <button class="skin-dot" data-skin="naranja" aria-label="Naranja"></button>
          <button class="skin-dot" data-skin="azul"    aria-label="Azul"></button>
          <button class="skin-dot" data-skin="verde"   aria-label="Verde"></button>
          <button class="skin-dot" data-skin="morado"  aria-label="Morado"></button>
          <button class="skin-dot" data-skin="mono"    aria-label="Mono"></button>
        </div>
      </div>
    </div>

    <div class="np" id="np" hidden>
      <div class="line">
        <span id="npIcon" style="color:var(--accent)">▶</span>
        <span class="title" id="npTitle">—</span>
        <span class="time" id="npTime"></span>
      </div>
      <div class="bar"><div class="fill" id="npFill"></div></div>
    </div>

    <div class="pad" id="pad">
      <button class="up"    data-key="ArrowUp"    aria-label="Arriba">▲<small id="lblUp"></small></button>
      <button class="left"  data-key="ArrowLeft"  aria-label="Izquierda">◀<small id="lblLeft"></small></button>
      <button class="ok"    data-key="Enter"      aria-label="Aceptar">OK<small id="lblOk"></small></button>
      <button class="right" data-key="ArrowRight" aria-label="Derecha">▶<small id="lblRight"></small></button>
      <button class="down"  data-key="ArrowDown"  aria-label="Abajo">▼<small id="lblDown"></small></button>
    </div>

    <div class="row c3">
      <button data-key="Backspace" aria-label="Atrás">↩<span>Atrás</span></button>
      <!-- La "m" es menú en la interfaz y silencio con mpv vivo: el rótulo
           cambia con el modo para no prometer lo que no hace. -->
      <button data-key="m" id="btnM"><span class="ico" id="mIco">☰</span><span id="mLbl">Menú</span></button>
      <button data-key="i" aria-label="Ayuda">?<span>Ayuda</span></button>
    </div>

    <div class="sec-title play-title">Reproduciendo</div>
    <div class="row c3 play-only">
      <button data-key="[" aria-label="Atrás un minuto">⏪<span>−60s</span></button>
      <button data-key="s" aria-label="Subtítulos">💬<span>Subtítulos</span></button>
      <button data-key="]" aria-label="Adelante un minuto">⏩<span>+60s</span></button>
    </div>

    <div class="row c1">
      <a class="btn" href="/api">⌨<span>Teclado</span></a>
    </div>

    <div class="status" id="status">Toca un botón.</div>
  </div>

<script>
  const SKINS = ["rojo", "naranja", "azul", "verde", "morado", "mono"];
  const SKIN_KEY = "kutral.remote.skin";

  function applySkin(skin) {
    if (!SKINS.includes(skin)) skin = "rojo";
    document.documentElement.setAttribute("data-skin", skin);
    document.querySelectorAll(".skin-dot").forEach((d) => {
      d.classList.toggle("active", d.dataset.skin === skin);
    });
    try { localStorage.setItem(SKIN_KEY, skin); } catch {}
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) {
      const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
      if (bg) meta.setAttribute("content", bg);
    }
  }
  (function initSkin() {
    let saved = "rojo";
    try { saved = localStorage.getItem(SKIN_KEY) || "rojo"; } catch {}
    applySkin(saved);
  })();

  const skinBtn = document.getElementById("skinBtn");
  const skinMenu = document.getElementById("skinMenu");
  skinBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    const open = skinMenu.classList.toggle("open");
    skinBtn.setAttribute("aria-expanded", open ? "true" : "false");
  });
  document.querySelectorAll(".skin-dot").forEach((dot) => {
    dot.addEventListener("click", (e) => {
      e.stopPropagation();
      applySkin(dot.dataset.skin);
      skinMenu.classList.remove("open");
      skinBtn.setAttribute("aria-expanded", "false");
    });
  });
  document.addEventListener("click", () => {
    if (skinMenu.classList.contains("open")) {
      skinMenu.classList.remove("open");
      skinBtn.setAttribute("aria-expanded", "false");
    }
  });

  const status = document.getElementById("status");
  // A dónde fue la última tecla: "ok" (interfaz), "mpv", "emu". El auto-repeat
  // solo corre cuando manda la interfaz: en un juego el hold ya es real
  // (down/up) y repetir el "down" sería pulsar dos veces.
  let ruta = "ok";

  function vibrar() {
    try { if (navigator.vibrate) navigator.vibrate(8); } catch {}
  }

  async function send(key, down) {
    try {
      const r = await fetch("/key", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ key, down }),
      });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const destino = (await r.text()).trim();
      if (destino === "emu" || destino === "mpv" || destino === "ok") ruta = destino;
      if (down) {
        status.textContent = "→ " + (key === " " ? "Pausa" : key);
        status.className = "status";
      }
    } catch (e) {
      status.textContent = "Error: " + e.message;
      status.className = "status err";
    }
  }

  // pointerdown = apretar, pointerup/cancel = soltar. setPointerCapture asegura
  // recibir el "up" aunque el dedo se deslice fuera del botón.
  const REPETIBLES = new Set(["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"]);
  const REPEAT_DELAY = 420, REPEAT_EVERY = 130;

  document.querySelectorAll("[data-key]").forEach((el) => {
    const k = el.dataset.key;
    el.style.touchAction = "none";
    let held = false, t0 = null, t1 = null;
    const parar = () => {
      if (t0) { clearTimeout(t0); t0 = null; }
      if (t1) { clearInterval(t1); t1 = null; }
    };
    const press = (e) => {
      e.preventDefault();
      try { el.setPointerCapture(e.pointerId); } catch {}
      if (held) return;
      held = true;
      el.classList.add("press");
      vibrar();
      send(k, true);
      if (REPETIBLES.has(k)) {
        t0 = setTimeout(() => {
          t1 = setInterval(() => {
            if (ruta !== "ok") return; // en juego manda el hold real
            send(k, true);
          }, REPEAT_EVERY);
        }, REPEAT_DELAY);
      }
    };
    const release = () => {
      if (!held) return;
      held = false;
      parar();
      el.classList.remove("press");
      send(k, false);
    };
    el.addEventListener("pointerdown", press);
    el.addEventListener("pointerup", release);
    el.addEventListener("pointercancel", release);
    el.addEventListener("contextmenu", (e) => e.preventDefault());
  });

  // Teclado físico, si lo hay conectado al teléfono.
  const KEYMAP = {
    "ArrowUp": "ArrowUp", "ArrowDown": "ArrowDown",
    "ArrowLeft": "ArrowLeft", "ArrowRight": "ArrowRight",
    "Enter": "Enter", "Backspace": "Backspace", "Escape": "Escape",
    " ": " ", "i": "i", "I": "i", "m": "m", "M": "m", "s": "s", "S": "s",
  };
  const pressed = new Set();
  window.addEventListener("keydown", (e) => {
    const k = KEYMAP[e.key];
    if (!k) return;
    e.preventDefault();
    if (pressed.has(k)) return;
    pressed.add(k);
    send(k, true);
  });
  window.addEventListener("keyup", (e) => {
    const k = KEYMAP[e.key];
    if (!k) return;
    e.preventDefault();
    pressed.delete(k);
    send(k, false);
  });

  // ── Reproduciendo: sondea /mpv, muestra progreso y cambia el modo ─────────
  // En modo "play" el backend manda las flechas a mpv (±10s y volumen), así
  // que los rótulos de la cruceta cambian para decir lo que hacen de verdad.
  const np = document.getElementById("np");
  const npTitle = document.getElementById("npTitle");
  const npTime = document.getElementById("npTime");
  const npFill = document.getElementById("npFill");
  const npIcon = document.getElementById("npIcon");
  const lbl = {
    up: document.getElementById("lblUp"),
    down: document.getElementById("lblDown"),
    left: document.getElementById("lblLeft"),
    right: document.getElementById("lblRight"),
    ok: document.getElementById("lblOk"),
  };
  const ROTULOS = {
    nav:  { up: "", down: "", left: "", right: "", ok: "" },
    play: { up: "Vol +", down: "Vol −", left: "−10s", right: "+10s", ok: "Pausa" },
  };

  const mIco = document.getElementById("mIco");
  const mLbl = document.getElementById("mLbl");
  const btnM = document.getElementById("btnM");

  function setModo(modo) {
    if (document.body.dataset.mode === modo) return;
    document.body.dataset.mode = modo;
    const r = ROTULOS[modo];
    for (const k in r) lbl[k].textContent = r[k];
    const play = modo === "play";
    mIco.textContent = play ? "🔇" : "☰";
    mLbl.textContent = play ? "Silencio" : "Menú";
    btnM.setAttribute("aria-label", play ? "Silencio" : "Menú");
  }

  function fmt(s) {
    s = Math.max(0, Math.floor(s || 0));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
    const mm = String(m).padStart(2, "0"), xx = String(x).padStart(2, "0");
    return h > 0 ? `${h}:${mm}:${xx}` : `${m}:${xx}`;
  }

  async function pollMpv() {
    try {
      const r = await fetch("/mpv", { cache: "no-store" });
      const s = await r.json();
      if (s && s.running) {
        np.hidden = false;
        setModo("play");
        npTitle.textContent = s.title || "Reproduciendo";
        npIcon.textContent = s.pause ? "⏸" : "▶";
        const pct = s.duration > 0 ? (s.pos / s.duration) * 100 : 0;
        npFill.style.width = pct.toFixed(1) + "%";
        npTime.textContent = s.duration > 0 ? `${fmt(s.pos)} / ${fmt(s.duration)}` : fmt(s.pos);
      } else {
        np.hidden = true;
        setModo("nav");
      }
    } catch {
      np.hidden = true;
      setModo("nav");
    }
  }
  setInterval(pollMpv, 800);
  pollMpv();
</script>
</body>
</html>
