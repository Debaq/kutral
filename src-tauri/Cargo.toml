[package]
name = "kutral"
version = "26.10.5"
description = "Kütral"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kutral_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# build.rs: lib.exe de MSVC para armar mpv.lib en Windows.
cc = "1"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "json", "blocking"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "io-util", "net"] }
urlencoding = "2"
url = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
sha2 = "0.10"
hex = "0.4"
getrandom = "0.2"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
enigo = "0.6.1"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tiny_http = "0.12"
local-ip-address = "0.6"
# Cliente torrent embebido (plan B cuando RD bloquea un hash por DMCA/451).
# rust-tls para compartir el backend TLS que ya usa reqwest (ring), sin openssl.
librqbit = { version = "9.0.1", default-features = false, features = ["rust-tls"] }
# Transmitir a la TV (Google Cast). Cliente CASTV2 propio sobre rustls con
# ring (ver cast.rs: rust_cast no acepta el certificado X.509 v1 de las LG);
# mdns-sd descubre las TVs sin runtime async propio.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
mdns-sd = { version = "0.21", default-features = false }
argon2 = "0.5"
chacha20poly1305 = "0.10"
# VAD de WebRTC (libfvad, BSD-3, C portable) para sincronizar subtítulos
# por audio (sub_autosync.rs).
webrtc-vad = "0.4"

# Acceso directo al WebKitGTK del webview para activar MSE (Media Source
# Extensions), necesario para que hls.js reproduzca HLS in-app. La versión
# debe coincidir con la que usa wry para que los tipos sean compatibles.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "=2.0.2"
# GTK3 para embeber el GtkGLArea (render de libmpv) en el mismo toplevel del
# webview → una sola ventana. Versiones EXACTAS a las que usa tauri/wry para
# compartir tipos (gtk 0.18.2, glib 0.18.5).
gtk = "0.18"
gdk = "0.18"
glib = "0.18"
# libmpv embebido. En Linux con la Render API (OpenGL en el GtkGLArea).
libmpv2 = { version = "6.0.0", features = ["render"] }
# Resolver punteros GL desde libepoxy.so (el mismo loader que usa GtkGLArea):
# se los pasamos a libmpv como get_proc_address y leemos el FBO destino.
libloading = "0.8"
# setlocale(LC_NUMERIC, "C"): libmpv lo exige y GTK fija el locale del usuario
# (decimal con coma) → sin esto mpv_create() devuelve NULL.
libc = "0.2"
# D-Bus (portal Inhibit) para que el escritorio no se duerma mientras se
# reproduce. Misma versión que arrastra gtk 0.18.
gio = "0.18"

# Reproductor embebido en Windows (mpv_embed/win32.rs): libmpv sin render (mpv
# dibuja solo en su ventana hija) + Win32 para la ventana y el input. Necesita
# vendor/mpv-dev/libmpv-2.dll (fetch-windows.ps1).
[target.'cfg(windows)'.dependencies]
libmpv2 = { version = "6.0.0", default-features = false }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# Cliente HTTP bloqueante para el test e2e del servidor de streaming local.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
