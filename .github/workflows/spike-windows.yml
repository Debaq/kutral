name: Spike reproductor Windows

# Prueba del reproductor embebido en Windows (feature embed-win, mpv_win.rs)
# sin tener Windows: el runner lanza Kütral con un video, saca capturas de
# pantalla, hace clic sobre el video y aprieta Esc, y sube capturas + logs
# como artefacto. Solo a mano (Actions → Run workflow).
on:
  workflow_dispatch:

jobs:
  spike:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: embed-win

      - name: Fetch vendored binaries (con libmpv)
        shell: pwsh
        run: pwsh src-tauri/vendor/fetch-windows.ps1 -Embed

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build del front
        run: pnpm build

      # custom-protocol: la interfaz va dentro del binario (sin él, Tauri
      # busca el servidor de desarrollo).
      - name: Build con embed-win
        working-directory: src-tauri
        run: cargo build --features embed-win,tauri/custom-protocol

      - name: Correr el spike
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "spike"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item src-tauri/vendor/mpv-dev/libmpv-2.dll src-tauri/target/debug/

          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class U {
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint f, uint x, uint y, uint d, UIntPtr e);
            [DllImport("user32.dll")] public static extern void keybd_event(byte k, byte s, uint f, UIntPtr e);
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
          }
          "@
          function Captura($nombre) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $img = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($img)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $img.Save((Join-Path $dir $nombre), [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $img.Dispose()
            Write-Host "captura $nombre ($($b.Width)x$($b.Height)), primer plano: $([U]::GetForegroundWindow())"
          }

          $env:KUTRAL_SPIKE_EMBED = "https://download.blender.org/demo/movies/ToS/tears_of_steel_720p.mov"
          $env:KUTRAL_SPIKE_DIR = $dir
          $p = Start-Process -FilePath src-tauri/target/debug/kutral.exe -PassThru `
            -RedirectStandardError (Join-Path $dir "stderr.txt") `
            -RedirectStandardOutput (Join-Path $dir "stdout.txt")
          Start-Sleep 35
          $p.Refresh()
          Write-Host "ventana de Kütral: $($p.MainWindowHandle)"
          [U]::SetForegroundWindow($p.MainWindowHandle) | Out-Null
          Start-Sleep 2
          Captura "1-video.png"

          # Clic en el centro (le da el foco al video) y Esc.
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          [U]::SetCursorPos([int]($b.Width / 2), [int]($b.Height / 2)) | Out-Null
          [U]::mouse_event(0x2, 0, 0, 0, [UIntPtr]::Zero); [U]::mouse_event(0x4, 0, 0, 0, [UIntPtr]::Zero)
          Start-Sleep 2
          Captura "2-tras-clic.png"
          [U]::keybd_event(0x1B, 0, 0, [UIntPtr]::Zero); [U]::keybd_event(0x1B, 0, 2, [UIntPtr]::Zero)
          Start-Sleep 3
          Captura "3-tras-esc.png"

          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep 1
          Write-Host "---- stderr (spike / mpv) ----"
          Get-Content (Join-Path $dir "stderr.txt") | Select-String -Pattern "spike|error|fail|vo/|d3d|libmpv" | Select-Object -First 80
          Write-Host "---- stdout (mpv) ----"
          Get-Content (Join-Path $dir "stdout.txt") | Select-Object -First 60
          Get-ChildItem $dir

      - name: Subir capturas y logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-windows
          path: ${{ runner.temp }}/spike
