name: CI

# Chequeos rápidos en cada push a main y en cada PR: tipos del front, tests
# del front, clippy sin avisos y tests del backend. El release (release.yml)
# sigue siendo aparte y solo corre con tags.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # pnpm va ANTES de setup-node: `cache: pnpm` necesita el binario.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libmpv-dev \
            libssl-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: svelte-check
        run: pnpm check

      - name: Tests del front
        run: pnpm test

      # generate_context! del backend exige que exista el frontendDist
      # (../build), así que el front se arma antes de compilar Rust.
      - name: Build del front
        run: pnpm build

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests del backend
        working-directory: src-tauri
        run: cargo test
