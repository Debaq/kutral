name: CI

# Chequeos rápidos en cada push a main y en cada PR: tipos del front, tests
# del front, clippy sin avisos y tests del backend. El release (release.yml)
# sigue siendo aparte y solo corre con tags.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # pnpm va ANTES de setup-node: `cache: pnpm` necesita el binario.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libmpv-dev \
            libssl-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: svelte-check
        run: pnpm check

      - name: Tests del front
        run: pnpm test

      # generate_context! del backend exige que exista el frontendDist
      # (../build), así que el front se arma antes de compilar Rust.
      - name: Build del front
        run: pnpm build

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests del backend
        working-directory: src-tauri
        run: cargo test

  windows:
    # El reproductor de Windows (player.rs, `cfg(not(target_os = "linux"))`)
    # no compila en Linux: sin este job sus errores aparecían recién en el
    # release, y nadie del equipo tiene Windows para probar a mano.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # mpv.exe de verdad para las pruebas de abajo (y uosc, igual que el
      # release).
      - name: Fetch vendored binaries (mpv + yt-dlp + uosc)
        shell: pwsh
        run: pwsh src-tauri/vendor/fetch-windows.ps1

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build del front
        run: pnpm build

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests del backend
        working-directory: src-tauri
        run: cargo test

      # Con red y mpv.exe: decodificar audio con un proceso aparte y
      # sincronizar el subtítulo oficial de Tears of Steel corrido 3.7 s.
      - name: Pruebas con mpv.exe (sincronía de subtítulos)
        working-directory: src-tauri
        shell: pwsh
        run: |
          $srt = Join-Path $env:RUNNER_TEMP "TOS-es.srt"
          Invoke-WebRequest -Uri "https://download.blender.org/demo/movies/ToS/subtitles/TOS-es.srt" -OutFile $srt -UseBasicParsing
          $env:TOS_SRT = $srt
          cargo test -- --ignored extraer_audio_proceso --nocapture
