name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # Notas del release (descargas + limitaciones). Las escribe este job, que es
  # el primero; los otros dos suben sus artefactos al release ya creado.
  build-linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # pnpm va ANTES de setup-node: `cache: pnpm` necesita el binario para
      # resolver el store. La versión sale de "packageManager" en package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libmpv-dev \
            libssl-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            p7zip-full \
            unzip

      - name: Cache vendor (mpv + yt-dlp + uosc)
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/vendor/mpv
            src-tauri/vendor/yt-dlp
            src-tauri/vendor/mpv-config/scripts
            src-tauri/vendor/mpv-config/fonts
          key: vendor-${{ hashFiles('src-tauri/vendor/fetch.sh') }}

      - name: Fetch vendored binaries (mpv + yt-dlp + uosc)
        run: bash src-tauri/vendor/fetch.sh

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # Sin bundle: el AppImage está jubilado y el resto de los formatos los
      # arma cada job por su cuenta (flatpak acá al lado, nsis/msi en Windows).
      - name: Build binario Linux
        run: pnpm exec tauri build --no-bundle

      - name: Guard - el binario tiene que linkear libmpv.so.2
        # ubuntu-22.04 traía libmpv-dev 0.34 (libmpv.so.1, API 1.109) y el
        # crate libmpv2 pide API 2.2: linkeaba igual y reventaba recién en
        # runtime, en la máquina del usuario. Si vuelve a pasar, falla acá.
        run: |
          readelf -d src-tauri/target/release/kutral | grep -q 'libmpv\.so\.2' \
            || { echo "::error::el binario no linkea libmpv.so.2"; \
                 readelf -d src-tauri/target/release/kutral | grep -i mpv; exit 1; }

      - name: Crear el release con las notas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          cat > notes.md <<'NOTES'
          ## Descargas

          - **Linux** — `kutral-VERSION-x86_64.flatpak`
            ```
            flatpak install --user kutral-VERSION-x86_64.flatpak
            flatpak run app.kutral.Kutral
            ```
          - **Linux, binario suelto** — `kutral-VERSION-linux-x86_64.bin`. No es
            autocontenido: pide `webkit2gtk-4.1`, `gtk3` y `mpv` ≥ 0.35 en el sistema.
          - **Windows** — `.msi` (instalador) o `.exe` (NSIS).

          ### El AppImage queda jubilado

          Las versiones hasta la v26.5.7 no arrancaban en distros modernas:
          empaquetaban libmpv 0.34 (`libmpv.so.1`) contra un binario que pide la
          API 2.2, y WebKitGTK 2.36 contra el Mesa del host. Los síntomas eran
          `VersionMismatch` y `Could not create default EGL display:
          EGL_BAD_PARAMETER`. En su lugar va el flatpak: el runtime de GNOME pone
          webkit, GTK3 y glibc, y los drivers los resuelve flatpak.

          ## Limitaciones

          - **Necesitas tus propias API keys.** Sin key de TMDb no cargan
            películas ni series — anime e IPTV sí funcionan. Sin cuenta
            debrid casi nada se reproduce: los scrapers devuelven magnets y
            resolverlos es justamente lo que hace el debrid. El plan B es bajar el
            torrent localmente, que es opt-in porque expone tu IP en el swarm.
            OMDb y Wyzie son opcionales.
          - **El flatpak pide flatpak ≥ 1.15.** Declara `--device=input` para el
            mando USB, y hasta la 1.14 no entiende ese permiso (Debian 12 y
            Ubuntu 24.04 traen 1.14: hay que actualizar flatpak).
          - **Dentro del sandbox** no hay wifi, brillo ni volumen del sistema, y
            el updater interno queda apagado: se actualiza con `flatpak update`.
          - **Plataformas**: Linux y Windows, solo x86_64. No hay macOS ni ARM.
            El reproductor mpv embebido es solo de Linux; en Windows mpv corre
            como proceso aparte.
          - **Juegos**: las ROMs salen de Myrient y el nombre tiene que calzar
            exacto con el set No-Intro; cualquier diferencia es un 404.
          NOTES
          sed -i "s/VERSION/${VERSION}/g" notes.md
          gh release create "$VERSION" \
            --title "Kütral $VERSION" \
            --notes-file notes.md \
            || gh release edit "$VERSION" --notes-file notes.md

      - name: Upload binario suelto (.bin)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          OUT="kutral-${VERSION}-linux-x86_64.bin"
          cp src-tauri/target/release/kutral "$OUT"
          gh release upload "$VERSION" "$OUT" --clobber

  build-flatpak:
    needs: build-linux
    # Distribución para cualquier Linux: el runtime de GNOME pone webkit2gtk,
    # GTK3 y glibc, y los drivers los resuelve flatpak con
    # org.freedesktop.Platform.GL.*, incluida la NVIDIA propietaria del host.
    #
    # Corre en la imagen de Flathub, no sobre el runner pelado. El runner trae
    # flatpak 1.14 y flatpak-builder 1.4.2, y esa combinación falla de dos
    # formas distintas: 1.14 rechaza el --device=input del manifest, y 1.4.2 no
    # pasa --libdir, con lo que meson instala en /app/lib64 y mpv no encuentra
    # libplacebo. La imagen trae 1.18.1 y 1.4.9, más GNOME 49, gh, 7z y unzip.
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # Lo único que la imagen no trae.
      - name: Extensiones de SDK (rust + node)
        run: |
          flatpak install -y --noninteractive flathub \
            org.freedesktop.Sdk.Extension.rust-stable//25.08 \
            org.freedesktop.Sdk.Extension.node22//25.08

      - name: Cache vendor (mpv + yt-dlp + uosc)
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/vendor/mpv
            src-tauri/vendor/yt-dlp
            src-tauri/vendor/mpv-config/scripts
            src-tauri/vendor/mpv-config/fonts
          key: vendor-${{ hashFiles('src-tauri/vendor/fetch.sh') }}

      - name: Fetch vendored binaries (mpv + yt-dlp + uosc)
        run: bash src-tauri/vendor/fetch.sh

      - name: Build flatpak
        working-directory: flatpak
        run: |
          # --disable-rofiles-fuse: el contenedor no tiene /etc/machine-id ni bus
          # de sesión, y rofiles-fuse muere ahí ("Failure spawning rofiles-fuse").
          # Solo sirve para detectar que un módulo pise archivos de otro previo;
          # la cadena acá es lineal (libass -> libplacebo -> mpv -> kutral).
          flatpak-builder --disable-rofiles-fuse --repo=repo --force-clean \
            --state-dir .flatpak-builder \
            .build app.kutral.Kutral.yml

      - name: Bundle .flatpak
        working-directory: flatpak
        run: |
          VERSION="${{ github.ref_name }}"
          flatpak build-bundle repo \
            "kutral-${VERSION}-x86_64.flatpak" app.kutral.Kutral

      - name: Upload al release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          # --repo explícito: dentro del contenedor los archivos son de otro
          # uid y git corta con "detected dubious ownership", así que gh no
          # puede deducir el repo solo. Con --repo no toca git.
          gh release upload "$VERSION" \
            "flatpak/kutral-${VERSION}-x86_64.flatpak" \
            --repo "${{ github.repository }}" --clobber

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    needs: build-linux
    steps:
      - uses: actions/checkout@v5

      # pnpm va ANTES de setup-node: `cache: pnpm` necesita el binario para
      # resolver el store. La versión sale de "packageManager" en package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust (stable + windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Fetch vendored binaries (mpv + yt-dlp + uosc)
        shell: pwsh
        run: pwsh src-tauri/vendor/fetch-windows.ps1

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build & sign Tauri (Windows .msi + .exe)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Kütral ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target x86_64-pc-windows-msvc
