name: Prueba reproductor Windows

# Prueba del reproductor de Windows (mpv_embed/win32.rs) sin tener Windows: el runner lanza Kütral con un video
# (KUTRAL_PRUEBA_VIDEO), maneja la barra con teclas y mouse, saca capturas de
# cada paso y sube capturas + logs como artefacto. Mismo guion que la prueba
# en Linux. Solo a mano (Actions → Run workflow).
on:
  workflow_dispatch:

jobs:
  prueba:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: prueba

      - name: Fetch vendored binaries (libmpv + mpv + yt-dlp)
        shell: pwsh
        run: pwsh src-tauri/vendor/fetch-windows.ps1

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build del front
        run: pnpm build

      # custom-protocol: la interfaz va dentro del binario (sin él, Tauri
      # busca el servidor de desarrollo).
      - name: Build
        working-directory: src-tauri
        run: cargo build --features tauri/custom-protocol

      - name: Correr la prueba
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "spike"
          New-Item -ItemType Directory -Force $dir | Out-Null

          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class U {
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint f, uint x, uint y, uint d, UIntPtr e);
            [DllImport("user32.dll")] public static extern void keybd_event(byte k, byte s, uint f, UIntPtr e);
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
            public static void Tecla(byte k) { keybd_event(k, 0, 0, UIntPtr.Zero); keybd_event(k, 0, 2, UIntPtr.Zero); }
          }
          "@
          function Captura($nombre) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $img = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($img)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $img.Save((Join-Path $dir $nombre), [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $img.Dispose()
            Write-Host "captura $nombre ($($b.Width)x$($b.Height)), primer plano: $([U]::GetForegroundWindow())"
          }

          $env:KUTRAL_PRUEBA_VIDEO = "https://download.blender.org/demo/movies/ToS/tears_of_steel_720p.mov"
          $p = Start-Process -FilePath src-tauri/target/debug/kutral.exe -PassThru `
            -RedirectStandardError (Join-Path $dir "stderr.txt") `
            -RedirectStandardOutput (Join-Path $dir "stdout.txt")
          Start-Sleep 35
          $p.Refresh()
          Write-Host "ventana de Kütral: $($p.MainWindowHandle)"
          [U]::SetForegroundWindow($p.MainWindowHandle) | Out-Null
          Start-Sleep 2
          Captura "1-reproduciendo.png"
          [U]::Tecla(0x0D); Start-Sleep 2; Captura "2-pausa-barra.png"          # Enter
          [U]::Tecla(0x27); [U]::Tecla(0x27); Start-Sleep 1; Captura "3-foco-movido.png"  # → →
          [U]::Tecla(0x43); Start-Sleep 2; Captura "4-menu-subs.png"          # c
          [U]::Tecla(0x1B); Start-Sleep 1; [U]::Tecla(0x20); Start-Sleep 1    # Esc (cierra menú), espacio
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          [U]::SetCursorPos([int]($b.Width / 2), [int]($b.Height / 2)) | Out-Null; Start-Sleep -Milliseconds 300
          [U]::SetCursorPos([int]($b.Width / 2) + 40, [int]($b.Height / 2) + 20) | Out-Null; Start-Sleep 1
          Captura "5-mouse-barra.png"
          [U]::Tecla(0x1B); Start-Sleep 3; Captura "6-tras-esc.png"           # Esc → interfaz

          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep 1
          Write-Host "---- stderr (spike / mpv) ----"
          Get-Content (Join-Path $dir "stderr.txt") | Select-String -Pattern "mpv-embed|prueba|panic|error|fail" | Select-Object -First 80
          Write-Host "---- stdout (mpv) ----"
          Get-Content (Join-Path $dir "stdout.txt") | Select-Object -First 60
          Get-ChildItem $dir

      - name: Subir capturas y logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prueba-windows
          path: ${{ runner.temp }}/spike
